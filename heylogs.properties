# heylogs configuration — consumed by `heylogs check` (.github/workflows/check-changelog.yml).
#
# Findings & rationale (2026-06, when the CHANGELOG check was added):
# Only ERROR-level rules fail CI; WARN/INFO do not (exit code stays 0). So the
# `unknown-link-type` warnings on the PlantUML/release links are left enabled —
# they don't break the build and are mildly useful.
#
# The rules below are disabled because they clash with this changelog's
# deliberate, long-standing layout (not because the entries are wrong):
#
#   type-of-changes-grouped  - releases are written as "### [YYYY-R] – date"
#                              nested under "## TeXLive YYYY" group headings, so
#                              versions are at h3; heylogs then tries to read them
#                              as Added/Changed groups and fails to parse them.
#   all-h2-contain-a-version - the "## TeXLive YYYY" group headings (and the old
#                              "## v1.0.0" history) are intentionally not versions.
#   date-displayed           - "## [edge]" is a dateless rolling section (kept as
#                              "edge" on purpose; it maps to the :edge docker tag).
#   forge-ref                - false positive: plain gitlab.com URLs / prose like
#                              "islandoftex/images/texlive" and "git-latexdiff" are
#                              read as if they should be @mention forge refs.
#
# Fixed in the changelog instead of disabled: http:// -> https:// links (the
# `https` rule stays ON to catch future ones).
#
# Rule ids: https://github.com/nbbrd/heylogs
rules=type-of-changes-grouped:OFF,all-h2-contain-a-version:OFF,date-displayed:OFF,forge-ref:OFF
