name: Check Markdown

# markdownlint rules are configured in .markdownlint.yml, textlint rules in .textlintrc.json.
# textlint deliberately has no dead-link rule: Docker Hub rate limits and redirects make it flaky.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown with markdownlint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  textlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Lint Markdown with textlint
        run: >
          npx --yes
          --package textlint@15.8.0
          --package textlint-rule-terminology@5.2.16
          --package textlint-rule-common-misspellings@1.0.1
          textlint $(git ls-files '*.md')
