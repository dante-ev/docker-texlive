name: Publish Docker Image

on:
  schedule:
    # run on 1th and 15th of each month
    - cron: '1 2 1,15 * *'
  push:
    branches:
      - main
      - ghactionstest
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  # Builds each platform on a native runner (arm64 on ubuntu-24.04-arm) and merges them into one
  # multi-platform image. Emulating arm64 with QEMU made the font-cache warm-up take hours.
  build:
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signing attestations with GitHub OIDC
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      set-meta-labels: true
      meta-images: |
        danteev/texlive
        ghcr.io/dante-ev/texlive
      meta-tags: |
        type=schedule,pattern={{date 'YYYY-MM-DD'}}
        type=ref,event=tag
        type=edge,branch=main
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        - registry: ghcr.io
          username: koppor
          password: ${{ secrets.CR_PAT }}
