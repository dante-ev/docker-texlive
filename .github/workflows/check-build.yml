name: Check build of docker image

on:
  schedule:
    # 1h later than publish.yml
    - cron: '1 3 1,15 * *'
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: network=host
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Build
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: localhost:5000/name/app:latest
      - name: lacheck
        working-directory: test
        run: |
          docker run -v $(pwd):/workdir localhost:5000/name/app:latest lacheck minimal-article.tex
      - name: chktex
        working-directory: test
        run: |
          docker run -v $(pwd):/workdir localhost:5000/name/app:latest chktex minimal-article.tex
      - name: latexindent
        working-directory: test
        run: |
          docker run -v $(pwd):/workdir localhost:5000/name/app:latest latexindent minimal-article.tex
      - name: minimal-article.tex
        working-directory: test
        run: |
          docker run -v $(pwd):/workdir localhost:5000/name/app:latest pdflatex minimal-article.tex
      - name: minimal-codehigh.tex
        working-directory: test
        run: |
          docker run -v $(pwd):/workdir localhost:5000/name/app:latest lualatex minimal-codehigh.tex
      - name: minimal-minted.tex
        working-directory: test
        run: |
          docker run -v $(pwd):/workdir localhost:5000/name/app:latest pdflatex --shell-escape minimal-minted.tex
      - name: minimal-plantuml.tex
        working-directory: test
        run: |
          docker run -v $(pwd):/workdir localhost:5000/name/app:latest lualatex --shell-escape minimal-plantuml.tex
      - name: minimal-mermaid.tex
        working-directory: test
        run: |
          docker run -v $(pwd):/workdir localhost:5000/name/app:latest pdflatex --shell-escape minimal-mermaid.tex
      - name: minimal-ltmermaid.tex
        working-directory: test
        run: |
          docker run -v $(pwd):/workdir localhost:5000/name/app:latest lualatex --shell-escape minimal-ltmermaid.tex
      - name: minimal-tikz-uml.tex
        working-directory: test
        run: |
          docker run -v $(pwd):/workdir localhost:5000/name/app:latest pdflatex minimal-tikz-uml.tex
      - name: minimal-selnolig.tex
        working-directory: test
        run: |
          docker run -v $(pwd):/workdir localhost:5000/name/app:latest lualatex minimal-selnolig.tex
      # Test compilation of a .tex file referencing a .tex file in a parent directory.
      # Issue: https://github.com/dante-ev/docker-texlive/issues/39
      - name: current-file.tex
        working-directory: test/subdir1
        run: |
          docker run -v $(pwd)/..:/workdir localhost:5000/name/app:latest /bin/bash -c "cd subdir1 && lualatex current-file.tex"
      # latexmk must not rerun lualatex in a fresh container just because of
      # luaotfload's font caches: https://github.com/dante-ev/docker-texlive/issues/51
      - name: 51-lualatex-simple.tex
        working-directory: test
        run: |
          docker run -v $(pwd):/workdir localhost:5000/name/app:latest latexmk -pdflua 51-lualatex-simple.tex
      - name: 51-lualatex-simple.tex (second run in a fresh container is a no-op)
        working-directory: test
        run: |
          output=$(docker run -v $(pwd):/workdir localhost:5000/name/app:latest latexmk -pdflua 51-lualatex-simple.tex)
          echo "$output"
          echo "$output" | grep -q "All targets (.*) are up-to-date"
          ! echo "$output" | grep -q "Run number"
      - name: Archive PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            test/**/*.pdf
